# 配信1回分の音声から、文ごとの時刻つき文字起こしを取る（調査用）
# 目的: 画面と音を合わせるのに必要な「どの言葉が何秒に話されたか」が、
#       GitHub Actions の CPU だけで、どのくらいの時間と精度で取れるかを確かめる
name: 音声から時刻つき文字起こし（調査用）

on:
  workflow_dispatch:
    inputs:
      key:
        description: 本文ファイル名（例 2025-12-01_school-milk-vs-store.txt）
        required: true
      model:
        description: faster-whisper のモデル（small / medium / large-v3-turbo など）
        required: false
        default: "small"
      minutes:
        description: 先頭から何分ぶんだけ試すか（0 で全部）
        required: false
        default: "0"

jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: databank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 道具
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q faster-whisper
          nproc; free -h | head -2
      - name: pody から音声URLを取る
        run: node scripts/video/pody-meta.mjs --key "${{ inputs.key }}" --out /tmp/meta.json
      - name: 音声を取得
        run: |
          AUDIO=$(node -e "console.log(require('/tmp/meta.json').audio)")
          curl -sS -L -A "Mozilla/5.0" -o /tmp/ep.mp3 --max-time 300 "$AUDIO"
          if [ "${{ inputs.minutes }}" != "0" ]; then
            ffmpeg -y -loglevel error -i /tmp/ep.mp3 -t $(( ${{ inputs.minutes }} * 60 )) -ac 1 -ar 16000 /tmp/ep.wav
          else
            ffmpeg -y -loglevel error -i /tmp/ep.mp3 -ac 1 -ar 16000 /tmp/ep.wav
          fi
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/ep.wav
      - name: 文字起こし（時刻つき）
        run: |
          python3 - <<'PY'
          import json, time
          from faster_whisper import WhisperModel
          t0 = time.time()
          model = WhisperModel("${{ inputs.model }}", device="cpu", compute_type="int8")
          t1 = time.time()
          segs, info = model.transcribe("/tmp/ep.wav", language="ja", beam_size=1, vad_filter=True,
                                        initial_prompt="酪農、乳牛、牛乳、搾乳、乳価、乳房炎、給食、パスチャライズ、超高温殺菌、乳脂肪率。")
          out = []
          for s in segs:
              out.append({"start": round(s.start, 2), "end": round(s.end, 2), "text": s.text.strip()})
          t2 = time.time()
          json.dump({"model": "${{ inputs.model }}", "audio_sec": info.duration, "load_sec": round(t1-t0,1),
                     "transcribe_sec": round(t2-t1,1), "segments": out}, open("/tmp/asr.json","w"), ensure_ascii=False, indent=1)
          print(f"音声 {info.duration:.0f} 秒 / モデル読み込み {t1-t0:.0f} 秒 / 文字起こし {t2-t1:.0f} 秒（実時間の {info.duration/(t2-t1):.1f} 倍速）/ 文の数 {len(out)}")
          print("---- 先頭40文 ----")
          for s in out[:40]:
              m, sec = divmod(int(s["start"]), 60)
              print(f"{m:02d}:{sec:02d}  {s['text']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: asr-${{ inputs.key }}
          path: /tmp/asr.json
          retention-days: 14
