name: 計測の通信の点検（本物のブラウザで公開中のサイトを開く）
# 2026-11-15: Cloudflare Web Analytics が10日たっても0のため、ビーコンの読み込みと送信が起きているかを見る。見るだけで何も変えない
on:
  workflow_dispatch:
    inputs:
      url:
        description: 開くページ
        required: false
        default: https://kawakamidairyfarm-png.github.io/izumo-agri-portal/
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.56.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > c.mjs <<'JS'
          import { chromium } from 'playwright'
          const b = await chromium.launch()
          const ctx = await b.newContext({ userAgent: 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Mobile Safari/537.36', viewport: { width: 390, height: 844 } })
          const p = await ctx.newPage()
          p.on('request', (r) => { if (/cloudflareinsights|script\.google|goatcounter/.test(r.url())) console.log('REQ', r.method(), r.url().slice(0, 120)) })
          p.on('response', (r) => { if (/cloudflareinsights/.test(r.url())) console.log('RES', r.status(), r.url().slice(0, 120)) })
          p.on('requestfailed', (r) => { if (/cloudflareinsights/.test(r.url())) console.log('FAIL', r.url().slice(0, 120), r.failure()?.errorText) })
          p.on('console', (m) => { if (m.type() === 'error' || m.type() === 'warning') console.log('CONSOLE', m.type(), m.text().slice(0, 200)) })
          p.on('pageerror', (e) => console.log('PAGEERROR', e.message))
          await p.goto(process.env.URL, { waitUntil: 'load' })
          await p.waitForTimeout(3000)
          console.log('beacon script tags:', await p.evaluate(() => [...document.scripts].filter((s) => s.src.includes('cloudflareinsights')).map((s) => s.src + ' ' + s.getAttribute('data-cf-beacon'))))
          await p.mouse.move(100, 200); await p.mouse.wheel(0, 800)
          await p.waitForTimeout(2000)
          await p.goto(process.env.URL + 'questions/', { waitUntil: 'load' })
          await p.waitForTimeout(4000)
          await p.close() // 閉じるときに送るビーコンも見る
          await new Promise((r) => setTimeout(r, 2000))
          await b.close()
          JS
          URL='${{ inputs.url }}' node c.mjs
