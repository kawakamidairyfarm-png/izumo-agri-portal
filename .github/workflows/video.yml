# 配信1回分を「本人の音声＋章立てスライド」の動画（mp4）にして、成果物として置く（学習教材の試作）
# 材料: data/transcripts の全文（pody の章・用語・まとめ）と、pody の再生ページにある音声URLと章の再生秒。
# できた mp4 は Actions の成果物からダウンロードして、YouTube に手でアップロードする（限定公開など）。
name: 配信を動画にする（試作）

on:
  workflow_dispatch:
    inputs:
      key:
        description: 本文ファイル名（例 2026-09-16_x5564f57.txt）
        required: true
      size:
        description: 画面サイズ
        required: false
        default: "1920x1080"
      max_minutes:
        description: 動画の上限（分）。Instagram は 20 分まで。0 で上限なし
        required: false
        default: "20"
      mode:
        description: long＝章立ての長い動画 / short＝60〜90秒の縦型（clips/<key>.json の範囲を切る）
        required: false
        default: "long"
      from_to:
        description: short のとき、切る範囲を秒で上書き（例 477-552）。空なら clips/<key>.json
        required: false
        default: ""
      asr_model:
        description: short のとき使う音声認識モデル
        required: false
        default: "kotoba-tech/kotoba-whisper-v2.0-faster"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: databank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 道具（ffmpeg・日本語フォント・ブラウザ）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: pody から音声URLと章の秒を取る
        run: node scripts/video/pody-meta.mjs --key "${{ inputs.key }}" --out /tmp/meta.json
      - name: 音声を取得
        run: |
          AUDIO=$(node -e "console.log(require('/tmp/meta.json').audio)")
          curl -sS -L -A "Mozilla/5.0" -o /tmp/ep.mp3 --max-time 300 "$AUDIO"
          ls -la /tmp/ep.mp3
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/ep.mp3
      - name: スライドを描いて動画にする
        if: inputs.mode != 'short'
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: |
          CH=$(node -e "console.log(require('/tmp/meta.json').chapters.map(c=>c.seconds).join(','))")
          node scripts/video/make.mjs --key "${{ inputs.key }}" --out /tmp/video --audio /tmp/ep.mp3 --meta /tmp/meta.json --chapters "$CH" --size "${{ inputs.size }}" --max-minutes "${{ inputs.max_minutes }}"
          rm -f /tmp/video/f-*.png
          cat /tmp/video/youtube.txt
          ls -la /tmp/video
      # ---- 縦型（short）: 音声認識で字幕の時刻を作り、clips/<key>.json の範囲を切る ----
      - uses: actions/setup-python@v5
        if: inputs.mode == 'short'
        with:
          python-version: "3.11"
      - name: 音声認識の準備
        if: inputs.mode == 'short'
        run: pip install -q faster-whisper
      - name: 音声認識の結果を使い回す
        if: inputs.mode == 'short'
        id: asr-cache
        uses: actions/cache@v4
        with:
          path: /tmp/asr.json
          key: asr-v2-${{ inputs.key }}-${{ inputs.asr_model }}
      - name: 音声から文ごとの時刻を取る
        if: inputs.mode == 'short' && steps.asr-cache.outputs.cache-hit != 'true'
        run: |
          ffmpeg -y -loglevel error -i /tmp/ep.mp3 -ac 1 -ar 16000 /tmp/ep.wav
          python3 scripts/video/asr.py --audio /tmp/ep.wav --out /tmp/asr.json --model "${{ inputs.asr_model }}"
      - name: 縦型の短い動画にする
        if: inputs.mode == 'short'
        env:
          PLAYWRIGHT_DIR: /tmp/pw
        run: |
          RANGE="${{ inputs.from_to }}"
          EXTRA=""
          if [ -n "$RANGE" ]; then EXTRA="--from ${RANGE%-*} --to ${RANGE#*-}"; fi
          node scripts/video/short.mjs --key "${{ inputs.key }}" --asr /tmp/asr.json --audio /tmp/ep.mp3 --out /tmp/video $EXTRA
          rm -f /tmp/video/s-*.png
          echo "---- post.txt ----"; cat /tmp/video/post.txt
          ls -la /tmp/video
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.key }}
          path: |
            /tmp/video/*.mp4
            /tmp/video/thumbnail.png
            /tmp/video/youtube.txt
            /tmp/video/cover.png
            /tmp/video/captions.srt
            /tmp/video/post.txt
            /tmp/meta.json
            /tmp/asr.json
          retention-days: 14
