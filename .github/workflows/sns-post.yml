# 毎日のSNS自動投稿（酪農データバンクの「届いた質問と答え」を1日1問）
# 中身は scripts/sns/pick.mjs が公開のたびに作る sns/today.json。投稿は scripts/sns/post.mjs。
# 本番にするには: Settings → Secrets and variables → Actions
#   Variables: SNS_LIVE=on と、投稿したいSNSの SNS_INSTAGRAM / SNS_FACEBOOK / SNS_THREADS / SNS_X を on
#   Secrets  : post.mjs の先頭に書いた鍵（Threads の鍵は60日で切れる。11月末に作り直す）
# 止めるとき: Variables の SNS_LIVE を off にする（すぐ止まる）
name: SNS自動投稿（データバンクの1日1問）

on:
  schedule:
    # 投稿は日本時間 19:00〜21:00 のあいだに1回（2026-10-06 本人「だいたい19:00〜21:00までに投稿できれば良い」）。
    # この repo の GitHub の時刻指定は 6〜9時間遅れることがある（10/5 は 19:07 の予約が翌朝 4:14、10/6 は7回とも 1:16〜2:24 に動いた）。
    # そこで「昼〜夕方に起きて、19:03 まで待ってから投稿する」回を置く（下の wait）。遅れて夜に起きた回はそのまま投稿、時間帯の外なら何もしない
    - cron: '7 5 * * *'   # 14:07 起き → 19:03 まで待つ
    - cron: '7 6 * * *'   # 15:07
    - cron: '7 7 * * *'   # 16:07
    - cron: '7 8 * * *'   # 17:07
    - cron: '7 9 * * *'   # 18:07
    - cron: '7 10 * * *'  # 19:07（時刻どおりならすぐ投稿）
    - cron: '37 10 * * *' # 19:37
    - cron: '7 11 * * *'  # 20:07
    - cron: '37 11 * * *' # 20:37
  workflow_dispatch:
    inputs:
      live:
        description: on にすると本番（オンにしたSNSへ投稿）。空なら Variables の SNS_LIVE に従う
        required: false
        default: ''
      check:
        description: on にすると点検だけ（投稿せず、鍵が使えるかを確かめる）
        required: false
        default: ''

permissions:
  contents: write
  actions: write # 記録のあと公開（pages.yml）を呼ぶため

jobs:
  # 予約で早く起きた回は、19:03（日本時間）まで待つ。待つのは最長5時間45分（GitHub の1回の上限は6時間）
  # 待っている回は1つだけにする（後から起きた回は前の回が終わるのを待ち、そのあと「投稿済み」で止まる）。手で動かしたときは待たない
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: sns-wait-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - name: 19時まで待つ
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Tokyo date -d 'today 19:03' +%s)
          left=$((target - now))
          echo "いまは日本時間 $(TZ=Asia/Tokyo date +%H:%M)"
          if [ "$left" -gt 0 ] && [ "$left" -le 20700 ]; then
            echo "19:03 まで $((left / 60)) 分待ちます"
            sleep "$left"
          elif [ "$left" -gt 20700 ]; then
            echo "19:03 まで6時間近くあるので待ちません（このあと時間帯の外として止まる）"
          else
            echo "もう19時を過ぎているので、すぐ投稿に進みます"
          fi

  post:
    needs: wait
    runs-on: ubuntu-latest
    concurrency:
      group: sns-post
      cancel-in-progress: false
    defaults:
      run:
        working-directory: databank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 投稿する
        env:
          SNS_LIVE: ${{ inputs.live || vars.SNS_LIVE }}
          SNS_WINDOW: ${{ vars.SNS_WINDOW }}
          SNS_CHECK: ${{ inputs.check }}
          SNS_INSTAGRAM: ${{ vars.SNS_INSTAGRAM }}
          SNS_FACEBOOK: ${{ vars.SNS_FACEBOOK }}
          SNS_THREADS: ${{ vars.SNS_THREADS }}
          SNS_X: ${{ vars.SNS_X }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/sns/post.mjs
      # 投稿した記録を残す（同じ質問を二度出さないため）。そのあと公開を呼んで、明日の1問を選び直す
      - name: 記録を残す
        if: always()
        run: |
          if git diff --quiet data/sns-posted.json; then echo "記録の変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sns-posted.json
          git commit -m "SNS自動投稿の記録"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -sS -o /dev/null -w "公開の呼び出し: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -d '{"ref":"main"}'
