# 酪農データバンク（databank/）を GitHub Pages に公開する
# 初回だけ: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Deploy databank to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['databank/**', '!databank/inbox/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: databank/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # 計測（任意）。リポジトリの Settings → Secrets and variables → Actions → Variables に置くと有効になる
          VITE_LOG_ENDPOINT: ${{ vars.LOG_ENDPOINT }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      # Instagram の質問カード（新しい質問7組）を dist/instagram/ に作る。毎日のSNSルーティンが cards.json を読む。
      # 失敗してもサイトの公開は止めない
      - name: Instagram 質問カード
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/instagram/make-cards.mjs --latest 7 --site dist/instagram
      - uses: actions/upload-pages-artifact@v3
        with:
          path: databank/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 新しく増えた・変わったページを IndexNow（Bing など）に知らせる。一覧は prerender が作る indexnow.json。
      # 失敗しても公開には影響しない
      - name: IndexNow に知らせる
        continue-on-error: true
        run: |
          sleep 30
          curl -sSf "${{ steps.deployment.outputs.page_url }}indexnow.json" -o indexnow.json
          echo "送るページ: $(jq '.urlList | length' indexnow.json) 件"
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
