    <script>
      // 旧い住所（.../#/e/xxxx の形）で来た人を、新しい住所へ送る。以前に配った URL を生かすため。
      if (location.hash.indexOf('#/') === 0) {
        var dir = location.pathname.replace(/index\.html$/, '')
        if (dir.charAt(dir.length - 1) !== '/') dir += '/'
        location.replace(dir + location.hash.slice(2))
      }
      // http:// で開かれたら https:// に切り替える（GitHub Pages 側の強制設定が効くまでの保険）
      if (location.protocol === 'http:' && /\.github\.io$/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
    </script>
    <style>
      /*
        prerender.mjs が #root の中に書き出す静的な本文は、検索エンジンのためのもの。
        CSS と JavaScript が届くまでの一瞬、人には飾りの無い文字の羅列として見えてしまうので隠す
        （React が起動すると中身ごと置き換わるので、人の見え方はこれまでどおり）。
        JavaScript が動かない環境では読めないと困るため、noscript で見えるように戻す。
      */
      #root > .prerender { display: none; }
    </style>
    <noscript><style>#root > .prerender { display: block; }</style></noscript>
  </head>
  <body>
