<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#172a19}
.wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:660px 540px}
.text{position:relative;padding:48px 0 0 84px;color:#fdfbf6;font-family:"Noto Sans JP",sans-serif}
.brand{display:flex;align-items:center;gap:22px}.logo{height:124px;width:auto;background:#fdfbf6;border-radius:14px;padding:8px 14px;box-sizing:border-box}.eyebrow{font-size:26px;font-weight:700;color:#f2cf7a;letter-spacing:.06em}
h1{margin:22px 0 0;font-family:"Noto Serif JP",serif;font-weight:900;font-size:68px;line-height:1.15;letter-spacing:-.02em;color:#fdfbf6;white-space:nowrap}
.bar{width:120px;height:8px;background:#f2cf7a;margin:28px 0 28px}
.lead{font-size:40px;font-weight:700;line-height:1.35;color:#fdfbf6}
.foot{position:absolute;left:84px;bottom:58px;font-size:26px;font-weight:700;color:#f2cf7a}
.photo{position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);display:block}
.photo::before{content:"";position:absolute;inset:0 auto 0 0;width:110px;background:linear-gradient(90deg,#172a19 0%,rgba(23,42,25,0) 100%);z-index:1}
</style></head><body>
<div class="wrap">
  <div class="text">
    <div class="brand"><img class="logo" src="logo.png" alt=""><span class="eyebrow">島根県出雲市</span></div>
    <h1>酪農データバンク</h1>
    <div class="bar"></div>
    <div class="lead">牛乳の「なぜ？」に、<br>出雲の酪農家が答える。</div>
    <div class="foot">登録なし・無料で読めます</div>
  </div>
  <div class="photo" style="--pos: 62% 45%"><img src="PHOTO" alt=""></div>
</div>
</body></html>
