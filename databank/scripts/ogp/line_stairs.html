<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#fdfbf6;font-family:"Noto Sans JP",sans-serif;color:#172a19}
.top{background:#172a19;height:330px;padding:56px 72px 0;box-sizing:border-box;color:#fdfbf6;position:relative}
.brand{display:flex;align-items:center;gap:20px}
.logo{height:96px;width:auto;background:#fdfbf6;border-radius:12px;padding:6px 12px;box-sizing:border-box}
.small{font-size:24px;font-weight:700;color:#f2cf7a;letter-spacing:.06em}
.new{position:absolute;right:72px;top:64px;background:#f2cf7a;color:#172a19;font-weight:900;font-size:26px;padding:10px 22px;border-radius:999px}
h1{margin:34px 0 0;font-family:"Noto Serif JP",serif;font-weight:900;font-size:84px;line-height:1.1;letter-spacing:-.01em}
.sub{margin:10px 0 0;font-size:28px;font-weight:700;color:#fdfbf6;opacity:.95}
.body{padding:40px 72px 0;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:#fff;border:2px solid #efe6d2;border-radius:20px;padding:26px 28px}
.card h2{margin:0 0 16px;font-family:"Noto Serif JP",serif;font-size:32px;font-weight:900}
.card h2 span{font-size:22px;font-weight:700;color:#5f665a;font-family:"Noto Sans JP",sans-serif;margin-left:10px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:14px;font-size:27px;font-weight:700;line-height:1.3;margin:0 0 14px}
li i{flex:none;width:44px;height:44px;border-radius:50%;background:#2f5232;color:#fff;font-style:normal;font-family:"Noto Serif JP",serif;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.foot{margin:30px 72px 0;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700;color:#2f5232}
.foot b{background:#2f5232;color:#fff;border-radius:999px;padding:10px 24px;font-weight:700}
.photo{position:absolute;left:0;right:0;bottom:0;height:190px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block}</style></head><body>
<div class="top">
  <div class="brand"><img class="logo" src="logo.png" alt=""><span class="small">酪農データバンク</span></div>
  <div class="new">新しい入口</div>
  <h1>あなたはいま、どこ？</h1>
  <p class="sub">いまの自分に近い段から読めます。</p>
</div>
<div class="body">
  <div class="card"><h2>牛乳を飲む人<span>3段</span></h2><ol>
    <li><i>1</i>スーパーで、ふと気になった</li>
    <li><i>2</i>牛のことが、気になってきた</li>
    <li><i>3</i>買う以外に、応援できることは</li></ol></div>
  <div class="card"><h2>酪農を志す人<span>4段</span></h2><ol>
    <li><i>1</i>憧れている。向いているか知りたい</li>
    <li><i>2</i>現実を知りたい。お金と、大変さと、やめる話</li>
    <li><i>3</i>準備を始める</li>
    <li><i>4</i>飼っている。飼い始めた</li></ol></div>
</div>
<div class="foot"><span>登録なし・無料で読めます</span><b>川上牧場 酪農データバンク</b></div>
<div class="photo"><img src="jersey.jpg" alt=""></div>
</body></html>
