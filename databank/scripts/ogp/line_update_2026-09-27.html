<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#fdfbf6;font-family:"Noto Sans JP",sans-serif;color:#172a19}
.top{background:#172a19;padding:56px 72px 52px;box-sizing:border-box;color:#fdfbf6;position:relative}
.brand{display:flex;align-items:center;gap:20px}
.logo{height:96px;width:auto;background:#fdfbf6;border-radius:12px;padding:6px 12px;box-sizing:border-box}
.small{font-size:24px;font-weight:700;color:#f2cf7a;letter-spacing:.06em}
.new{position:absolute;right:72px;top:64px;background:#f2cf7a;color:#172a19;font-weight:900;font-size:26px;padding:10px 22px;border-radius:999px}
h1{margin:36px 0 0;font-family:"Noto Serif JP",serif;font-weight:900;font-size:64px;line-height:1.3;letter-spacing:-.01em}
.body{padding:40px 72px 0}
ol{list-style:none;margin:0;padding:0;display:grid;gap:18px}
li{display:flex;align-items:center;gap:22px;background:#fff;border:2px solid #efe6d2;border-radius:20px;padding:22px 28px}
li i{flex:none;width:56px;height:56px;border-radius:50%;background:#2f5232;color:#fff;font-style:normal;font-family:"Noto Serif JP",serif;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center}
li b{display:block;font-size:34px;font-weight:900;line-height:1.25}
li span{display:block;margin-top:4px;font-size:24px;font-weight:500;color:#4a5246;line-height:1.35}
.photo{position:absolute;left:0;right:0;bottom:0;height:150px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block}
</style></head><body>
<div class="top">
  <div class="brand"><img class="logo" src="logo.png" alt=""><span class="small">酪農データバンク</span></div>
  <div class="new">今日の更新</div>
  <h1>あなたの質問が、誰かの牛乳を<br>もっとおいしくする。</h1>
</div>
<div class="body"><ol>
  <li><i>1</i><div><b>届いた質問を、1問ずつのページに</b><span>質問・答えの要約・答えた回をまとめて読めます</span></div></li>
  <li><i>2</i><div><b>学校の先生・栄養士の方へ</b><span>給食だよりや食育に使える質問を選びました</span></div></li>
  <li><i>3</i><div><b>メルマガ登録で、PDFをプレゼント</b><span>『牛乳の「なぜ？」10の答え』がすぐ届きます</span></div></li>
</ol></div>
<div class="photo"><img src="jersey.jpg" alt=""></div>
</body></html>
